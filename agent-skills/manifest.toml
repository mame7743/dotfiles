# agent-skills/manifest.toml — 導入するスキルの宣言 (single source of truth)
#
# スキル本体は原文のまま使用する。ここでは「どれを・どこから・どの Agent へ」
# 導入するかだけを管理する。
#
#   name   : スキル識別名。SKILL.md の frontmatter `name` と配置ディレクトリ名に一致させる。
#   source : dotfiles ルートからの相対パス（その直下に SKILL.md がある）。
#   agents : 導入先 Agent の一覧（下の [agents] テーブルのキー）。
#
# 同じ導入先 (agent × name) を複数スキルへ割り当てると install.sh がエラーにする。
# 未使用 Agent 向けの定義・処理は追加しない（現在は opencode のみ）。

[agents]
opencode = "~/.config/opencode/skills"

# --- 公開スキル: mame7743/memory-bank -------------------------------------
[[skills]]
name   = "memory-bank"
source = "agent-skills/repos/memory-bank"
agents = ["opencode"]

