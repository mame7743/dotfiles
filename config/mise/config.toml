# mise — 言語ランタイムのグローバル固定（唯一の情報源）
#
# 反映: mise install   （install-deps.sh が自動実行する）
# 確認: mise ls        /  make deps-check
#
# 方針: ランタイムは再現性のため固定する。プロジェクト固有の版は
#       各リポジトリの .tool-versions / mise.toml で上書きする。
# 更新: ここを編集して `mise install`（deps/versions.env とは役割を分ける）。
#
# 注意: バージョンは「今そのマシンで使っている版」に合わせてある。
#       上げるときは mise install 後に動作確認すること。

[tools]
node   = "26.8.1"
python = "3.11.4"
go     = "1.27.1"
ruby   = "3.2.0"

[settings]
# python-build-standalone は GitHub artifact attestations を発行していないため、
# python のみ当該検証を無効化する（SHA256 チェックサム検証は引き続き有効）。
python.github_attestations = false
